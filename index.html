<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mafistudio</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: black;
  color: white;
  font-family: 'Segoe UI', sans-serif;
  overflow-x: hidden;
}

/* FONDO ANIMADO */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, #111 0%, black 70%);
  animation: pulse 6s infinite;
  z-index: -1;
}

@keyframes pulse {
  0% { opacity: 0.8; }
  50% { opacity: 1; }
  100% { opacity: 0.8; }
}

/* LOGO */
.logo {
  text-align: center;
  margin-top: 60px;
  animation: fadeIn 2s ease;
}

.logo img {
  width: 140px;
  filter: drop-shadow(0 0 10px gold);
}

.logo h1 {
  margin-top: 10px;
  letter-spacing: 4px;
}

.logo p {
  color: #aaa;
  margin-top: 5px;
}

/* JUEGOS */
.games {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 80px;
  flex-wrap: wrap;
}

.game {
  width: 260px;
  transition: 0.3s;
  cursor: pointer;
}

.game img {
  width: 100%;
  border-radius: 12px;
  transition: 0.3s;
}

.game:hover {
  transform: scale(1.05);
}

.game:hover img {
  filter: brightness(1.2);
}

.game h3 {
  margin-top: 10px;
}

.game p {
  color: #bbb;
  font-size: 14px;
}

/* BOTÓN */
.button {
  display: inline-block;
  margin-top: 10px;
  padding: 8px 14px;
  border: 1px solid gold;
  color: gold;
  text-decoration: none;
  border-radius: 5px;
  transition: 0.3s;
}

.button:hover {
  background: gold;
  color: black;
}

/* REDES */
.socials {
  text-align: center;
  margin-top: 80px;
}

.socials h2 {
  margin-bottom: 20px;
}

.socials a {
  display: inline-block;
  margin: 10px;
  color: white;
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: 0.3s;
}

.socials a:hover {
  color: gold;
  border-bottom: 1px solid gold;
}

/* CONTACTO */
.contact {
  text-align: center;
  margin: 40px;
  color: gray;
}

/* ANIMACIÓN */
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(-20px);}
  to {opacity: 1; transform: translateY(0);}
}
</style>

</head>

<body>

<!-- LOGO -->
<div class="logo">
  <img src="BackgroundEraser_20260903_210443779.png">
  <h1>MAFISTUDIO</h1>
  <p>Estudio indie cubano-canadiense | Unreal Engine</p>
</div>

<!-- JUEGOS -->
<div class="games">

  <!-- ROOMRUSH -->
  <div class="game">
    <img src="roomrush.jpg">
    <h3>RoomRush</h3>
    <p>Horror estilo Backrooms con estética VHS y criaturas.</p>
    <a class="button" href="#">Ver más</a>
  </div>

  <!-- VAERYN -->
  <div class="game">
    <img src="vaeryn.jpg">
    <h3>Vaeryn</h3>
    <p>RPG fantasía, survival, 1ra y 3ra persona.</p>
    <a class="button" href="https://mafiageta.itch.io/vaeryn" target="_blank">Jugar / Ver</a>
  </div>

</div>

<!-- REDES -->
<div class="socials">
  <h2>Redes</h2>

  <a href="https://tiktok.com/@mafiageta.gamer" target="_blank">TikTok</a>
  <a href="https://discord.gg/bQcBrzudbF" target="_blank">Discord</a>
  <a href="https://facebook.com/Mafiageta-Gamer-03-Oficial-102993022062430" target="_blank">Facebook</a>
  <a href="https://kick.com/mafiageta-gamer" target="_blank">Kick</a>
  <a href="https://twitch.tv/Mafiageta" target="_blank">Twitch</a>
  <a href="https://instagram.com/mafiageta_gamer" target="_blank">Instagram</a>
  <a href="https://www.reddit.com/user/Old-Examination-8498/" target="_blank">Reddit</a>

</div>

<!-- CONTACTO -->
<div class="contact">
  <p>Contacto: mafiagetagamer@gmail.com</p>
</div>

</body>
</html>
